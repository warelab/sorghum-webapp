# Site settings for TARGET_SITE=live (www.sorghumbase.org).
#
# create_app() loads this file after default.cfg when the TARGET_SITE env
# var is "live" (the default); dev.cfg holds the same keys for
# dev.sorghumbase.org. Flask reads them (e.g. the navbar's Ensembl links), and
# base.html hands the search app its share as window.SORGHUMBASE_SITE.

TARGET_SITE = 'live'

# Ensembl genome browser the navbar and the gene search link to.
ENSEMBL_URL = 'https://ensembl.sorghumbase.org'

# REST base serving /primers for the gene search's Primers tab, or None to
# hide the tab.
PRIMERS_API = None
